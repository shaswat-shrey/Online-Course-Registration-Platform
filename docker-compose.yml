# UCRAMS local infrastructure and production-like stack.
#
#   docker compose up -d                 # infra only: postgres, redis, minio, mailpit
#   docker compose --profile app up -d   # + api, worker, web (built images, NODE_ENV=production)
#
# Defaults are local-development credentials. The "app" profile runs the API in
# production mode, which REFUSES example secrets: copy .env.docker.example to
# .env (repo root, read by Compose) and set real values first.
name: ucrams

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ucrams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ucrams_dev_password}
      POSTGRES_DB: ucrams_dev
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ucrams -d ucrams_dev']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    # noeviction: BullMQ data must never be evicted (ARCHITECTURE.md §9).
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/ucrams && mc anonymous set none local/ucrams"

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']

  # ----- Application (profile "app") -----------------------------------------
  migrate:
    profiles: [app]
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ['npx', 'prisma', 'migrate', 'deploy']
    working_dir: /app/apps/api
    environment: &app-env
      NODE_ENV: production
      DATABASE_URL: postgresql://ucrams:${POSTGRES_PASSWORD:-ucrams_dev_password}@postgres:5432/ucrams_dev?schema=public
      REDIS_URL: redis://redis:6379/0
      STORAGE_DRIVER: s3
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:?Set STORAGE_SIGNING_SECRET in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ucrams
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MAIL_TRANSPORT: smtp
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-UCRAMS <no-reply@ucrams.local>}
      PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:8080}
      WEB_APP_URL: ${PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: '1'
      API_DOCS_ENABLED: 'false'
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [app]
    restart: unless-stopped
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health/ready']
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    profiles: [app]
    restart: unless-stopped
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ['node', 'apps/api/dist/worker.js']
    environment: *app-env
    depends_on:
      api: { condition: service_healthy }

  web:
    profiles: [app]
    restart: unless-stopped
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ['8080:8080']
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
